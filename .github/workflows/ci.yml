name: FuelUp Education CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # Test Python Backend
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r apps/backend/requirements.txt
        pip install pytest httpx

    - name: Run Pytest
      run: |
        cd apps/backend
        pytest -v -o log_cli=true

  # Test Frontend React/Next.js
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-size: '18'
        cache: 'npm'
        cache-dependency-path: apps/web/package.json

    - name: Install dependencies
      run: |
        cd apps/web
        npm install

    - name: Verify Web Build
      run: |
        cd apps/web
        npm run build --if-present
