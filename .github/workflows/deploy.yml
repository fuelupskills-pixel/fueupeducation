name: Deploy Next.js Static to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Monorepo Dependencies
      run: |
        npm ci

    - name: Build Web Frontend (Static Export)
      env:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
      run: |
        npm run build -w web-frontend

    - name: FTP Deploy Static Assets to Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: "89.116.133.132"
        username: "u505146222.fuelupeducation.com"
        password: "Fuelup@786"
        local-dir: apps/web/out/
        server-dir: ./
        danger-clean-slate: false
